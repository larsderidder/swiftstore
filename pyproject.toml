[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftstore"
version = "0.1.0"
description = "Sync and async OpenStack Swift helpers with temp URL support."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Moving Spirits" }]
dependencies = [
    "requests>=2.31",
    "certifi>=2026.10.19",
    "aiohttp>=3.9,<3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
    "aioresponses>=0.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
